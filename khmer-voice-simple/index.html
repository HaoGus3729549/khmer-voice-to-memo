<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高棉语语音转文字 - 精简版</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin: 8px; }
    .btn-primary { background: #3498db; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    .status { padding: 12px; border-radius: 6px; margin: 12px 0; background: #ecf0f1; }
    .upload-area { border: 2px dashed #bdc3c7; border-radius: 8px; padding: 40px; text-align: center; margin: 20px 0; cursor: pointer; }
    .upload-area:hover { border-color: #3498db; background: #f8f9fa; }
    .result { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 16px; margin: 12px 0; min-height: 60px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
